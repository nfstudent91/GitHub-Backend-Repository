
name: CRM Backend CI-CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '22.x'

jobs:

  # STAGE 1 - BUILD
  Build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Build backend
        run: npm run build

      - name: Remove development dependencies
        run: npm prune --omit=dev

      - name: Prepare deployment ZIP
        run: |
          mkdir deploy
          git archive HEAD | tar -x -C deploy
          cp -r dist node_modules deploy/
          cd deploy
          zip -qr ../backend.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-package
          path: backend.zip

  # STAGE 2 - DEV
  DEV:
    needs: Build
    runs-on: ubuntu-latest
    environment: DEV-ENVIRONMENT

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: backend-package

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy DEV Backend
        run: |
          az webapp start -g DEV-RESOURCEGROUP -n dev-backendapp-crm
          az webapp deploy \
            -g DEV-RESOURCEGROUP \
            -n dev-backendapp-crm \
            --src-path backend.zip \
            --type zip \
            --clean true \
            --restart true

  # STAGE 3 - UAT
  UAT:
    needs: DEV
    runs-on: ubuntu-latest
    environment: UAT-ENVIRONMENT

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: backend-package

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy UAT Backend
        run: |
          az webapp start -g UAT-RESOURCEGROUP -n uat-backendapp-crm
          az webapp deploy \
            -g UAT-RESOURCEGROUP \
            -n uat-backendapp-crm \
            --src-path backend.zip \
            --type zip \
            --clean true \
            --restart true

  # STAGE 4 - PROD
  PROD:
    needs: UAT
    runs-on: ubuntu-latest
    environment: PROD-ENVIRONMENT

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: backend-package

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy PROD Backend
        run: |
          az webapp start -g PROD-RESOURCEGROUP -n prod-backendapp-crm
          az webapp deploy \
            -g PROD-RESOURCEGROUP \
            -n prod-backendapp-crm \
            --src-path backend.zip \
            --type zip \
            --clean true \
            --restart true
